spring:
  application:
    name: livres-svc
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:livres-db
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  ai:
    mcp:
      server:
        name: livres-mcp-server
        version: 1.0.0

server:
  port: 8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

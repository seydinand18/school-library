spring:
  application:
    name: emprunts-svc
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      httpclient:
        hc5:
          enabled: true
  datasource:
    url: jdbc:h2:mem:emprunts-db
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  ai:
    mcp:
      server:
        name: emprunts-mcp-server
        version: 1.0.0

server:
  port: 8083

springdoc:
  swagger-ui:
    path: /swagger-ui.html


resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 10s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
